# Custom Premium Neofetch Configuration - Cyberpunk Ghost Cyan HUD
# Simplified Version - Fixed Palette & Native Image Rendering

print_info() {
    # ─── HUD CABECERA ───
    info title
    info underline
    prin " $(color 51)"
    prin "$(color 51)┌───────────────────────────────────────┐"
    prin "$(color 51)│          $(color 81)CYBERNETIC SYSTEM         $(color 51)│"
    prin "$(color 51)├───────────────────────────────────────┤"
    
    # ─── INFORMACIÓN DE SOFTWARE ───
    info "  ▲  OS" distro
    info "  ⚃  KERN" kernel
    info "  ♦  UPTM" uptime
    info "  ❖  PKGS" packages
    info "  ▣  SHLL" shell
    info "  ▣  TERM" term
    info "  ❖  WMGR" wm
    
    # ─── DIVISOR DE RECURSOS ───
    prin "$(color 51)├───────────────────────────────────────┤"
    
    # ─── INFORMACIÓN DE HARDWARE ───
    info "  ■  CPU" cpu
    info "  ■  RAM" memory
    info "  ♦  DSK" disk
    
    # ─── PIE DE PANEL Y PALETA DE COLORES ───
    prin "$(color 51)├───────────────────────────────────────┤"
    prin "$(color 51)│  $(color 1)●  $(color 2)●  $(color 3)●  $(color 4)●  $(color 5)●  $(color 6)●  $(color 7)●  $(color 8)●  $(color 51)  │"
    prin "$(color 51)└───────────────────────────────────────┘"
    prin " "
}

# ─── AJUSTES GENERALES ───
os_arch="on"
kernel_shorthand="on"
distro_shorthand="on"
uptime_shorthand="on"
shell_path="off"
shell_version="off"

# ─── VELOCIDAD Y MARCAS DE CPU ───
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="off"
cpu_speed="on"
cpu_cores="off"
cpu_temp="off"

# ─── TAMAÑO Y DETALLE DE DISCO ───
disk_show=('/')
disk_subtitle="dir"
disk_percent="on"

# ─── FORMATOS DE MEMORIA ───
mem_percent="on"

# ─── DISEÑO Y SEPARADOR ───
# El separador es la flecha y fuerza el color del valor siguiente (color 7 = Blanco)
separator="  $(color 8)❯$(color 7)"

# ─── BARRAS DE PROGRESO DE RECURSOS ───
cpu_display="bar"
memory_display="bar"
disk_display="bar"
battery_display="bar"

bar_char_elapsed="█"
bar_char_total="░"
bar_border="off"
bar_length=12

# ─── AJUSTES DE COLORES NATIVOS ───
# Colores: (Título/Borde, Arroba, Etiquetas, Separador, Valores)
# 51 = Cian Brillante, 7 = Blanco, 8 = Gris Oscuro
colors=(51 7 51 8 7 51)

cpu_colors=(51 7)
memory_colors=(51 7)
disk_colors=(51 7)

# ─── CONFIGURACIÓN DE BACKEND DE IMAGEN ───
# Elige el backend compatible con tu terminal (kitty, ueberzug, w3m, chafa, pixterm, ascii)
# Si usas Kitty Terminal, déjalo en 'kitty'. Si usas Alacritty/Xterm, puedes probar 'ueberzug' o 'chafa'.
image_backend="kitty"

# La fuente de la imagen será inyectada dinámicamente de forma aleatoria por neofetch.sh
image_source="auto"

# Ajustes de tamaño de imagen
image_loop="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3

# Posición del logo / imagen
yoffset=0
xoffset=0
background_color=