# Custom Premium Neofetch Configuration - Cyberpunk/Hacker HUD
# Autogenerated by customize.py - DO NOT EDIT MANUALLY

print_info() {
    # ─── HUD CABECERA ───
    prin " "
    prin "$(color 82)┌───────────────────────────────────────┐"
    prin "$(color 82)│          $(color 198)  CYBERNETIC SYSTEM         $(color 82)│"
    prin "$(color 82)├───────────────────────────────────────┤"
    
    # ─── INFORMACIÓN DE SOFTWARE ───
    info "  ▲  OS" distro
    info "  ⚃  KERN" kernel
    info "  ♦  UPTM" uptime
    info "  ❖  PKGS" packages
    info "  ▣  SHLL" shell
    info "  ▣  TERM" term
    info "  ❖  WMGR" wm
    
    # ─── DIVISOR DE RECURSOS ───
    prin "$(color 82)├───────────────────────────────────────┤"
    
    # ─── INFORMACIÓN DE HARDWARE ───
    info "  ■  CPU" cpu
    info "  ■  RAM" memory
    info "  ♦  DSK" disk
    
    # ─── PIE DE PANEL Y PALETA DE COLORES ───
    prin "$(color 82)├───────────────────────────────────────┤"
    prin "$(color 82)│  $(color 1)●  $(color 2)●  $(color 3)●  $(color 4)●  $(color 5)●  $(color 6)●  $(color 7)●  $(color 8)●  $(color 82)  │"
    prin "$(color 82)└───────────────────────────────────────┘"
    prin " "
}

# ─── AJUSTES GENERALES ───
os_arch="on"
kernel_shorthand="on"
distro_shorthand="on"
uptime_shorthand="on"
shell_path="off"
shell_version="off"

# ─── VELOCIDAD Y MARCAS DE CPU ───
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="off"
cpu_speed="on"
cpu_cores="off"
cpu_temp="off"

# ─── TAMAÑO Y DETALLE DE DISCO ───
disk_show=('/')
disk_subtitle="dir"
disk_percent="on"

# ─── FORMATOS DE MEMORIA ───
mem_percent="on"

# ─── DISEÑO Y SEPARADOR ───
# El separador es la flecha y fuerza el color del valor siguiente
separator="  $(color 8)❯$(color 7)"

# ─── BARRAS DE PROGRESO DE RECURSOS ───
cpu_display="bar"
memory_display="bar"
disk_display="bar"
battery_display="bar"

bar_char_elapsed="█"
bar_char_total="░"
bar_border="off"
bar_length=12

# ─── AJUSTES DE COLORES NATIVOS ───
# Colores: (Título/Borde, Arroba, Etiquetas, Separador, Valores)
colors=(82 7 82 8 7)

cpu_colors=(82 7)
memory_colors=(82 7)
disk_colors=(82 7)

# ─── LOGO Y ARTE ASCII ───
image_backend="ascii"
image_source="auto"
ascii_distro="auto"
ascii_colors=(82 198)
ascii_bold="on"
stdout="off"
