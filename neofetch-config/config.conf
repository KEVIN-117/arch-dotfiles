# Custom Premium Neofetch Configuration - Cyberpunk/Hacker HUD
# Designed to be stunning, customizable, and high-performance.

print_info() {
    # ─── HUD CABECERA ───
    prin " "
    prin "$(color 2)┌───────────────────────────────────────┐"
    prin "$(color 2)│          $(color 198)  CYBERNETIC SYSTEM         $(color 2)│"
    prin "$(color 2)├───────────────────────────────────────┤"
    
    # ─── INFORMACIÓN DE SOFTWARE ───
    info "$(color 82)    OS" distro
    info "$(color 82)    KERN" kernel
    info "$(color 82)    UPTM" uptime
    info "$(color 82)    PKGS" packages
    info "$(color 82)    SHLL" shell
    info "$(color 82)    TERM" term
    info "$(color 82)    WMGR" wm
    
    # ─── DIVISOR DE RECURSOS ───
    prin "$(color 2)├───────────────────────────────────────┤"
    
    # ─── INFORMACIÓN DE HARDWARE ───
    info "$(color 39)    CPU " cpu
    info "$(color 39)    RAM " memory
    info "$(color 39)    DSK " disk
    
    # ─── PIE DE PANEL Y PALETA DE COLORES ───
    prin "$(color 2)├───────────────────────────────────────┤"
    prin "$(color 2)│  $(color 1)  $(color 2)  $(color 3)  $(color 4)  $(color 5)  $(color 6)  $(color 7)  $(color 8)  $(color 2)  │"
    prin "$(color 2)└───────────────────────────────────────┘"
    prin " "
}

# ─── AJUSTES GENERALES ───
# Ocultar etiquetas predeterminadas de neofetch ya que usamos las personalizadas
os_arch="on"
kernel_shorthand="on"
distro_shorthand="on"
uptime_shorthand="on"
shell_path="off"
shell_version="off"

# ─── VELOCIDAD Y MARCAS DE CPU ───
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="off"
cpu_speed="on"
cpu_cores="off"
cpu_temp="off"

# ─── TAMAÑO Y DETALLE DE DISCO ───
disk_show=('/')
disk_subtitle="dir"
disk_percent="on"

# ─── FORMATOS DE MEMORIA ───
mem_percent="on"

# ─── DISEÑO Y SEPARADOR ───
# Caracter separador entre etiqueta y valor
separator="  $(color 8)❯$(color 7)"

# ─── BARRAS DE PROGRESO DE RECURSOS ───
# Habilitar barras de progreso para CPU, RAM y Disco
cpu_display="bar"
memory_display="bar"
disk_display="bar"
battery_display="bar"

# Apariencia de la barra de progreso
bar_char_elapsed="█"
bar_char_total="░"
bar_border="off"
bar_length=12

# ─── AJUSTES DE COLORES ───
# Colores del texto: (Título, @, Subtítulo, Dos puntos, Información)
colors=(2 7 82 8 7)

# Opciones de color de la barra
# (Elixir de colores ANSI en la terminal)
cpu_colors=(39 7)
memory_colors=(39 7)
disk_colors=(39 7)

# ─── LOGO Y ARTE ASCII ───
# Usaremos nuestro banner personalizado Dune Rise como el logo principal.
image_backend="ascii"
image_source="auto"
ascii_distro="auto"
ascii_colors=(82 198)
ascii_bold="on"

# ─── CAPTURAS Y CONFIGURACIONES ADICIONALES ───
# Aseguramos que la terminal cargue limpiamente
stdout="off"
